name: Publish monthly rental reports

on:
  workflow_dispatch:
    inputs:
      backfill_month:
        description: "Month to backfill (YYYY-MM)"
        required: false
      dry_run:
        description: Validate cloud reports without committing or publishing
        type: boolean
        default: true
  schedule:
    - cron: "20 12 1 * *"
      timezone: America/Toronto

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-monthly-rentals
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      WEBFLOW_TOKEN: ${{ secrets.WEBFLOW_TOKEN }}
      WEBFLOW_SITE_ID: ${{ secrets.WEBFLOW_SITE_ID }}
      WEBFLOW_PRODUCTION_DOMAIN: www.inference-economics.com
      RENTAL_COLLECTION_ID: ${{ secrets.RENTAL_COLLECTION_ID }}

    steps:
      - name: Checkout reports repo
        uses: actions/checkout@v4

      - name: Set MONTH
        env:
          REQUESTED_MONTH: ${{ inputs.backfill_month }}
        run: |
          python - <<'PYCODE'
          from datetime import datetime, date, timedelta
          from zoneinfo import ZoneInfo
          import os, re
          value = os.environ.get('REQUESTED_MONTH', '').strip()
          if not value:
              today = datetime.now(ZoneInfo('America/Toronto')).date()
              value = (today.replace(day=1) - timedelta(days=1)).strftime('%Y-%m')
          if not re.fullmatch(r'\d{4}-\d{2}', value):
              raise SystemExit('Month must be YYYY-MM')
          date.fromisoformat(value + '-01')
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('MONTH=' + value + '\n')
          PYCODE
      - uses: google-github-actions/auth@v3
        with:
          project_id: apartment-scraping
          workload_identity_provider: projects/270346450366/locations/global/workloadIdentityPools/rental-pipeline-github/providers/github
      - uses: google-github-actions/setup-gcloud@v3
      - name: Download completed report bundle
        run: gcloud storage cp "gs://apartment-scraping-rental-data-270346450366/reports/$MONTH/reports.zip" "$RUNNER_TEMP/reports.zip"
      - name: Validate and import HTML pair
        run: python scripts/import_cloud_reports.py --archive "$RUNNER_TEMP/reports.zip" --month "$MONTH"
      - name: Save validated HTML for review
        uses: actions/upload-artifact@v4
        with:
          name: publication-preview-${{ env.MONTH }}
          path: |
            reports/toronto/${{ env.MONTH }}/index.html
            reports/vancouver/${{ env.MONTH }}/index.html
          if-no-files-found: error
          retention-days: 7
      - name: Verify reports exist
        shell: bash
        run: |
          test -s "reports/toronto/$MONTH/index.html"
          test -s "reports/vancouver/$MONTH/index.html"

      - name: Commit HTML
        if: github.event_name == 'schedule' || !inputs.dry_run
        shell: bash
        run: |
          git config user.name "gh-actions"
          git config user.email "actions@github.com"
          git add "reports/toronto/$MONTH/index.html" "reports/vancouver/$MONTH/index.html"
          if ! git diff --cached --quiet; then
            git commit -m "Publish $MONTH"
            git push
          fi

      - name: Create Webflow CMS items
        if: github.event_name == 'schedule' || !inputs.dry_run
        shell: bash
        run: |
          set -euo pipefail

          RUN_MONTH="$MONTH"

          mkpost () {
            CITY="$1"
            CITY_TITLE="$(tr '[:lower:]' '[:upper:]' <<< "${CITY:0:1}")${CITY:1}"
            MONTH_HUMAN="$(date -u -d "${RUN_MONTH}-01" +'%B %Y')"
            TITLE="${CITY_TITLE} Rental Report ${MONTH_HUMAN}"
            URL="https://reports.inference-economics.com/reports/${CITY}/${RUN_MONTH}/"
            SLUG="${CITY}-rentals-${RUN_MONTH}"

            BODY="$(
              RUN_MONTH="$RUN_MONTH" CITY_TITLE="$CITY_TITLE" TITLE="$TITLE" SLUG="$SLUG" URL="$URL" \
              python -c "import os,json; run=os.environ['RUN_MONTH']; city=os.environ['CITY_TITLE']; title=os.environ['TITLE']; slug=os.environ['SLUG']; url=os.environ['URL']; print(json.dumps({'isArchived': False, 'isDraft': False, 'fieldData': {'name': title, 'slug': slug, 'city': city, 'report-month': f'{run}-01T00:00:00.000Z', 'external-report-url': url, 'summary': f'<p>Monthly rental market intelligence for {city}.</p>'}}))"
            )"

            RESPONSE_FILE="$(mktemp)"
            HTTP_STATUS="$(
              curl --retry 5 --retry-all-errors --retry-delay 10 --retry-max-time 180 \
              -sS -o "$RESPONSE_FILE" -w "%{http_code}" -X POST "https://api.webflow.com/v2/collections/${RENTAL_COLLECTION_ID}/items" \
              -H "Authorization: Bearer ${WEBFLOW_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "${BODY}"
            )"

            if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
              rm -f "$RESPONSE_FILE"
              return 0
            fi

            if grep -Eiq "already exists|duplicate|slug" "$RESPONSE_FILE"; then
              echo "Webflow item for ${SLUG} already exists; continuing."
              rm -f "$RESPONSE_FILE"
              return 0
            fi

            cat "$RESPONSE_FILE" >&2
            rm -f "$RESPONSE_FILE"
            echo "Webflow item creation failed for ${SLUG} with HTTP ${HTTP_STATUS}" >&2
            return 1
          }

          mkpost toronto
          mkpost vancouver

      - name: Publish site
        if: github.event_name == 'schedule' || !inputs.dry_run
        shell: bash
        run: |
          PUBLISH_BODY="$(
            curl --retry 5 --retry-all-errors --retry-delay 10 --retry-max-time 180 \
              -fsS "https://api.webflow.com/v2/sites/${WEBFLOW_SITE_ID}/custom_domains" \
              -H "Authorization: Bearer ${WEBFLOW_TOKEN}" | \
            python -c "import json, os, sys; data=json.load(sys.stdin); target=os.environ['WEBFLOW_PRODUCTION_DOMAIN']; ids=[d['id'] for d in data.get('customDomains', []) if d.get('url', '').rstrip('/') == target]; ids or sys.exit(f'Production domain not found in Webflow: {target}'); print(json.dumps({'publishToWebflowSubdomain': True, 'customDomains': ids}))"
          )"

          echo "Publishing to staging and ${WEBFLOW_PRODUCTION_DOMAIN}"
          curl --retry 5 --retry-all-errors --retry-delay 10 --retry-max-time 180 \
            -fsS -X POST "https://api.webflow.com/v2/sites/${WEBFLOW_SITE_ID}/publish" \
            -H "Authorization: Bearer ${WEBFLOW_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "${PUBLISH_BODY}"
